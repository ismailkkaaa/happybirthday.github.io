<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="I made something for you - A handcrafted emotional birthday gift journey."
    />
    <title>I Made Something For You ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/invitation.css" />
  </head>
  <body class="is-dark">
    <main class="journey" data-chapter="1">
      <section class="invitation-level" aria-label="Secret invitation">
        <div class="invitation-card">
          <p class="level-kicker">Secret invitation</p>
          <h1>
            I made something for you
            <span style="color: #ff527c; display: inline-flex; align-items: center; vertical-align: middle; margin-left: 0.35rem; margin-top: -0.2rem;"><svg viewBox="0 0 24 24" fill="currentColor" style="width: 2rem; height: 2rem;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
          </h1>
          <p class="soft-copy">This isn't just a birthday website... It's a little gift.</p>
          
          <button id="openGiftButton" class="gift-button" type="button" aria-label="Open gift">
            <span class="luxury-gift" aria-hidden="true">
              <span class="gift-glow"></span>
              <img src="luxury_gift_box.png" class="gift-slice gift-lid-img" alt="" />
              <img src="luxury_gift_box.png" class="gift-slice gift-body-img" alt="" />
            </span>
            <span class="primary-button" style="display: inline-flex; align-items: center; justify-content: center;">
              Open Gift 
              <svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.2rem; height: 1.2rem; margin-left: 0.4rem; display: inline-block; vertical-align: middle;"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.67C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4V8h16v11zM11 9.5h2V18h-2zM5.5 12h13v2h-13z"/></svg>
            </span>
          </button>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/invitation.js"></script>
  </body>
</html>
