<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Our story, in little pieces. Scroll through our timeline of memories."
    />
    <title>Chapter 3: Our Story 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/story.css" />
  </head>
  <body>
    <main class="journey" data-chapter="3">
      <section class="story-level" aria-label="Our story timeline">
        
        <!-- Premium Instagram-Style Stories Container -->
        <div class="stories-viewer" id="storiesViewer">
          
          <!-- Segmented progress bars at the top -->
          <div class="progress-bar-container" id="progressBarContainer"></div>

          <!-- Header overlay (User Profile details) -->
          <div class="stories-header">
            <div class="profile-group">
              <div class="avatar-circle" style="color: #ff527c; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); border-radius: 50%;"><svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.3rem; height: 1.3rem;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
              <div class="profile-text">
                <span class="profile-name">Our Memories</span>
                <span class="profile-subtitle">Chapter 3</span>
              </div>
            </div>
            <button id="musicToggleBtn" class="mute-btn" type="button" aria-label="Mute or unmute music">
              <svg id="musicIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
              </svg>
            </button>
          </div>

          <!-- Slide Content Area -->
          <div class="slides-wrapper" id="slidesWrapper"></div>

          <!-- Gesture Navigation Overlay (Left & Right tap zones) -->
          <div class="nav-tap-zones">
            <div class="tap-zone left-zone" id="tapLeft" role="button" aria-label="Previous slide"></div>
            <div class="tap-zone right-zone" id="tapRight" role="button" aria-label="Next slide"></div>
          </div>

          <!-- Tutorial Helper (Fades out after 2.5 seconds) -->
          <div class="stories-tutorial" id="storiesTutorial">
            <div class="tut-instruction left-tut">👈 Tap left to go back</div>
            <div class="tut-instruction right-tut">Tap right to go forward 👉</div>
          </div>
        </div>

      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/story.js"></script>
  </body>
</html>
