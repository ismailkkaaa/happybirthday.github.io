<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A handwritten birthday letter to my favorite person."
    />
    <title>Chapter 4: The Letter 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/letter.css" />
  </head>
  <body class="is-dark">
    <main class="journey" data-chapter="4">
      <section class="letter-level" aria-label="Birthday letter">
        <div class="letter-shell">
          <div class="paper-card">
            <p class="level-kicker">A little letter for you</p>
            <h2>To my favorite person,</h2>
            <p id="typedLetter" class="typed-letter"></p>
            <span class="letter-signature"></span>
            
            <button id="surpriseButton" class="primary-button paper-button" type="button">
              Open the Surprise 🎁
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/letter.js"></script>
  </body>
</html>
