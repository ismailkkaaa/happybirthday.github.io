<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The peaceful ending. Happy birthday, thank you for existing."
    />
    <title>Ending: Softly 🌙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/ending.css" />
  </head>
  <body class="is-dark">
    <!-- Chapter 6 of 6. Progress indicator is omitted here for zero UI clutter. -->
    <main class="journey" data-chapter="6">
      <section class="ending-level" aria-label="Emotional ending">
        <!-- Slow Ken Burns montage layer -->
        <div id="endingMontage" class="ending-montage" aria-hidden="true"></div>

        <!-- Twinkling stars field -->
        <div id="endingStars" class="ending-stars" aria-hidden="true"></div>

        <!-- Centered slow emotional text sequence -->
        <div class="ending-copy" aria-live="polite">
          <p id="endingLine"></p>
        </div>

        <!-- Final permanent note -->
        <div id="finalNote" class="final-note" aria-live="polite">
          <p>
            <span style="color: #ffb347; display: inline-flex; align-items: center; vertical-align: middle; margin-right: 0.35rem; margin-top: -0.1rem;"><svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.25rem; height: 1.25rem;"><path d="M12 2l2.4 5.2 5.6 2.4-5.6 2.4-2.4 5.2-2.4-5.2-5.6-2.4 5.6-2.4zM20 16l1.2 2.6 2.8 1.2-2.8 1.2-1.2 2.6-1.2-2.6-2.8-1.2 2.8-1.2zM6 15l1.2 2.6 2.8 1.2-2.8 1.2-1.2 2.6-1.2-2.6-2.8-1.2 2.8-1.2z"/></svg></span>
            This little gift was made especially for you.
          </p>
          <p>I hope it brought a smile to your face.</p>
          <p>Thank you for taking this little journey.</p>
          <p class="heart-line" style="display: flex; align-items: center; justify-content: center;">
            <span style="color: #ff527c; display: inline-flex; align-items: center; vertical-align: middle; margin-right: 0.45rem; margin-top: -0.25rem;"><svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.6rem; height: 1.6rem;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
            Happy Birthday 
            <span style="color: #ff527c; display: inline-flex; align-items: center; vertical-align: middle; margin-left: 0.45rem; margin-top: -0.25rem;"><svg viewBox="0 0 24 24" fill="currentColor" style="width: 1.6rem; height: 1.6rem;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
          </p>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/ending.js"></script>

</html>
